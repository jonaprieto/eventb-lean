name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py
      - name: Corpus manifest is current
        run: python3 scripts/manifest.py --check

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache elan so runs do not re-download from releases.lean-lang.org, which
      # occasionally 429s, and cache the grip/batteries build.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Authenticate to the private grip dependency
        env:
          GRIP_TOKEN: ${{ secrets.GRIP_TOKEN }}
        run: |
          # jonaprieto/grip is private, so an anonymous runner cannot clone it and lake
          # fails with a bare "git exited with code 128". Fail here instead, with the fix.
          if [ -z "$GRIP_TOKEN" ]; then
            echo "::error::grip is private. Either 'gh secret set GRIP_TOKEN' with a" \
                 "repo-scoped PAT that can read jonaprieto/grip, or make grip public."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${GRIP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "EventB gates"
      - name: Compile book examples
        run: lake build Examples
      - name: Corpus ratchet
        run: |
          # `if !` tests the exit status directly, so a regression fails the job
          # regardless of the shell's set -e command-substitution semantics.
          if ! out=$(lake exe gates); then
            echo "$out"
            lake exe gates --histogram || true
            echo "gate failed: regression, or an unblessed improvement needing --bless" >&2
            exit 1
          fi
          echo "$out"
          {
            echo "### Corpus gates"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Status report generates
        run: |
          # STATUS.md is untracked, so a `git diff` check on it would always pass.
          # Running the generator still catches a crash in the reporting path.
          lake exe gates --status

  axioms:
    # The trust ledger. Once POG lands this enumerates, per obligation, whether it is
    # kernel-checked or leaning on an external prover. Rodin cannot produce this table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Authenticate to the private grip dependency
        env:
          GRIP_TOKEN: ${{ secrets.GRIP_TOKEN }}
        run: |
          # jonaprieto/grip is private, so an anonymous runner cannot clone it and lake
          # fails with a bare "git exited with code 128". Fail here instead, with the fix.
          if [ -z "$GRIP_TOKEN" ]; then
            echo "::error::grip is private. Either 'gh secret set GRIP_TOKEN' with a" \
                 "repo-scoped PAT that can read jonaprieto/grip, or make grip public."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${GRIP_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "EventB"
      - name: Audit refinement soundness axioms
        run: |
          lake env lean EventB/Semantics.lean | tee /tmp/axioms.txt
          # Not -x: `lake env lean` prefixes each line with `file:line:col:`.
          grep -Fq "'Proved.sound' does not depend on any axioms" /tmp/axioms.txt
          grep -Fq "'Refines.sound' does not depend on any axioms" /tmp/axioms.txt
