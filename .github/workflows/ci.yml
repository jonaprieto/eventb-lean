name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
      - name: Corpus manifest is current
        run: python3 tools/manifest.py --check
      - name: Private distribution boundary
        run: python3 tools/distribution-check.py

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache elan so runs do not re-download from releases.lean-lang.org, which
      # occasionally 429s, and cache the grip/batteries build.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Authenticate private Lake dependencies
        env:
          PRIVATE_DEPS_READ_TOKEN: ${{ secrets.PRIVATE_DEPS_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_DEPS_READ_TOKEN" ]; then
            echo "::error::Private Lake dependencies require PRIVATE_DEPS_READ_TOKEN."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${PRIVATE_DEPS_READ_TOKEN}@github.com/jonaprieto/".insteadOf \
            "https://github.com/jonaprieto/"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "EventB EventBWidgets Examples gates rossi-dump eventb bench"
      - name: CLI and fixture matrix
        run: python3 tools/cli-fixtures.py
      - name: Install pinned Rossi
        env:
          ROSSI_VERSION: 0.1.7
          ROSSI_SHA256: 698214d8082e2c9e0e8b638cd561ff0b6d9f1066ee5b79444f7ac54acfb7d10d
        run: |
          archive="$RUNNER_TEMP/rossi-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/eventb-rossi/rossi/releases/download/v${ROSSI_VERSION}/rossi-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ROSSI_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/rossi"
          tar -xzf "$archive" -C "$RUNNER_TEMP/rossi"
          "$RUNNER_TEMP/rossi/rossi" --version
          echo "ROSSI_BIN=$RUNNER_TEMP/rossi/rossi" >> "$GITHUB_ENV"
      - name: Rossi differential matrix
        run: python3 tools/rossi-diff.py
      - name: Corpus ratchet
        run: |
          # `if !` tests the exit status directly, so a regression fails the job
          # regardless of the shell's set -e command-substitution semantics.
          if ! out=$(lake exe gates); then
            echo "$out"
            lake exe gates --histogram || true
            echo "gate failed: regression, or an unblessed improvement needing --bless" >&2
            exit 1
          fi
          echo "$out"
          {
            echo "### Corpus gates"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Status report generates
        run: |
          lake exe gates --status
          git ls-files --error-unmatch STATUS.md baseline/p4.tsv baseline/wwd.tsv
          git diff --exit-code -- STATUS.md baseline/p4.tsv baseline/wwd.tsv

  axioms:
    # The trust ledger. Once POG lands this enumerates, per obligation, whether it is
    # kernel-checked or leaning on an external prover. Rodin cannot produce this table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Authenticate private Lake dependencies
        env:
          PRIVATE_DEPS_READ_TOKEN: ${{ secrets.PRIVATE_DEPS_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_DEPS_READ_TOKEN" ]; then
            echo "::error::Private Lake dependencies require PRIVATE_DEPS_READ_TOKEN."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${PRIVATE_DEPS_READ_TOKEN}@github.com/jonaprieto/".insteadOf \
            "https://github.com/jonaprieto/"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "EventB"
      - name: Audit refinement soundness axioms
        run: |
          lake env lean EventB/Semantics.lean | tee /tmp/axioms.txt
          # Not -x: `lake env lean` prefixes each line with `file:line:col:`.
          grep -Fq "'Proved.sound' does not depend on any axioms" /tmp/axioms.txt
          grep -Fq "'Refines.sound' does not depend on any axioms" /tmp/axioms.txt
